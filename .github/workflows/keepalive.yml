name: Keepalive

on:
  schedule:
    - cron: "0 5 */10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write timestamp
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: reset 60-day workflow timer" || exit 0
          git push
